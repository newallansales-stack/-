name: Deploy hardware dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_prices:
        description: '采集公开报价并继续查找历史文章（不核实成交，不填造缺失日期）'
        type: boolean
        default: false
  schedule:
    - cron: '15 1 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Test and build public dashboard
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    outputs:
      archive_updated_at: ${{ steps.archive_metadata.outputs.updated_at }}
      history_updated_at: ${{ steps.archive_metadata.outputs.history_updated_at }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        timeout-minutes: 5
        run: npm ci --prefer-offline --no-audit --no-fund --fetch-timeout=30000 --fetch-retries=2

      - name: Collect public source observations
        id: public_collection
        continue-on-error: true
        if: github.event_name == 'schedule' || inputs.refresh_prices
        timeout-minutes: 10
        run: npm run collect:public

      - name: Discover and collect historical article quotations
        id: history_collection
        continue-on-error: true
        if: github.event_name == 'schedule' || inputs.refresh_prices
        timeout-minutes: 10
        run: npm run collect:history

      - name: Record collection outcome without changing old price dates
        if: always() && (github.event_name == 'schedule' || inputs.refresh_prices)
        env:
          PUBLIC_COLLECTION_OUTCOME: ${{ steps.public_collection.outcome }}
          HISTORY_COLLECTION_OUTCOME: ${{ steps.history_collection.outcome }}
        run: node scripts/record-collection-status.mjs

      - name: Run tests
        run: npm test

      - name: Preserve collected observations
        if: github.event_name == 'schedule' || inputs.refresh_prices
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add datasets/public-prices.json datasets/historical-prices.json datasets/history-index.json datasets/collection-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record public hardware quote observations'
            git push origin HEAD:main
          fi

      - name: Build public quote archive and specifications catalog
        run: npm run build:pages

      - name: Record expected archive timestamp
        id: archive_metadata
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,appendFileSync} from 'node:fs';
          const archive=JSON.parse(readFileSync('datasets/public-prices.json','utf8'));
          if (!/^\d{4}-\d{2}-\d{2}T[\d:.]+Z$/.test(archive.updatedAt)) throw new Error('Invalid archive timestamp');
          appendFileSync(process.env.GITHUB_OUTPUT, `updated_at=${archive.updatedAt}\n`);
          const history=JSON.parse(readFileSync('datasets/historical-prices.json','utf8'));
          if (!/^\d{4}-\d{2}-\d{2}T[\d:.]+Z$/.test(history.updatedAt)) throw new Error('Invalid historical archive timestamp');
          appendFileSync(process.env.GITHUB_OUTPUT, `history_updated_at=${history.updatedAt}\n`);
          JS

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    name: Publish dashboard
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public dashboard
        env:
          DASHBOARD_URL: ${{ steps.deployment.outputs.page_url }}
          ARCHIVE_UPDATED_AT: ${{ needs.build.outputs.archive_updated_at }}
          HISTORY_UPDATED_AT: ${{ needs.build.outputs.history_updated_at }}
        run: |
          node --input-type=module <<'JS'
          const url = process.env.DASHBOARD_URL;
          if (!url?.startsWith('https://')) throw new Error('Missing HTTPS deployment URL');
          const expected=process.env.ARCHIVE_UPDATED_AT;
          if(!expected) throw new Error('Missing expected archive timestamp');
          const historyExpected=process.env.HISTORY_UPDATED_AT;
          if(!historyExpected) throw new Error('Missing expected history timestamp');
          let failure;
          for (let attempt = 0; attempt < 12; attempt++) {
            try {
              const response = await fetch(url, { signal: AbortSignal.timeout(15000) });
              const html = await response.text();
              const versionResponse = await fetch(new URL('data-version.json', url), { signal: AbortSignal.timeout(15000) });
              const version = await versionResponse.json();
              if (!versionResponse.ok || version.publicUpdatedAt !== expected || version.historyUpdatedAt !== historyExpected || !/^[a-f0-9]{64}$/.test(version.htmlSha256)) throw new Error('Published data version is stale');
              const {createHash} = await import('node:crypto');
              if (createHash('sha256').update(html).digest('hex') !== version.htmlSha256) throw new Error('HTML and data version do not match');
              if (!response.ok || !html.includes(expected) || !html.includes(historyExpected) || !html.includes('芯价') || !html.includes('content="source-observations"') || !html.includes('已收录的公开报价') || !html.includes('历史文章报价') || !html.includes('最近历史报价') || !html.includes('搜索我的自选') || !html.includes('搜索并添加自选') || !html.includes('搜索全部市场型号') || !html.includes('网页直接导入历史价格') || !html.includes('备份价格与自选') || !html.includes('source_page_only') || html.includes('src="/src/main.tsx"')) {
                throw new Error(`Dashboard not ready (HTTP ${response.status})`);
              }
              console.log(`Public dashboard verified: HTTP ${response.status} ${url}`);
              process.exit(0);
            } catch (error) { failure = error; }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          throw failure;
          JS
