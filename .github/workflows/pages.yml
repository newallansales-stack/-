name: Deploy hardware dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Test and build public dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build public demo snapshot
        run: npm run build:pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    name: Publish dashboard
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public dashboard
        env:
          DASHBOARD_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'JS'
          const url = process.env.DASHBOARD_URL;
          if (!url?.startsWith('https://')) throw new Error('Missing HTTPS deployment URL');
          let failure;
          for (let attempt = 0; attempt < 12; attempt++) {
            try {
              const response = await fetch(url, { signal: AbortSignal.timeout(15000) });
              const html = await response.text();
              if (!response.ok || !html.includes('芯价') || !html.includes('免费在线展示版') || html.includes('src="/src/main.tsx"')) {
                throw new Error(`Dashboard not ready (HTTP ${response.status})`);
              }
              console.log(`Public dashboard verified: HTTP ${response.status} ${url}`);
              process.exit(0);
            } catch (error) { failure = error; }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          throw failure;
          JS
